    #root {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { height: 5px; width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 860px) {
      .desktop-nav { display: none !important; }
      .desktop-header-actions { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
      main { padding: 14px 12px 60px !important; max-width: 100vw !important; }
      button, select, input { font-family: inherit; font-size: 14px !important; }
    }
    @media (min-width: 861px) {
      .desktop-nav { display: block !important; }
      .desktop-header-actions { display: flex !important; }
      .mobile-menu-btn { display: none !important; }
    }
  </style>
